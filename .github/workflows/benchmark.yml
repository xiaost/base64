name: Benchmark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Benchmark
        run: go test -run '^$' -bench . -benchtime=1s -timeout 60s ./...
